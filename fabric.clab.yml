name: fabric

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:latest
  nodes:
    spine1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - spine1/daemons:/etc/frr/daemons
        - spine1/frr.conf:/etc/frr/frr.conf
    leaf1:
      kind: nokia_srlinux
    leaf2:
      kind: nokia_srlinux
    h1:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.100.1/24 dev eth1
    h2:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.100.2/24 dev eth1
  links:
    - endpoints: ["spine1:eth1", "leaf1:e1-1"]
    - endpoints: ["spine1:eth2", "leaf2:e1-1"]
    - endpoints: ["leaf1:e1-2", "h1:eth1"]
    - endpoints: ["leaf2:e1-2", "h2:eth1"]
